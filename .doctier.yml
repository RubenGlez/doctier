version: 1

# .rubstack/ is the private doc store: encrypted in git, decrypted on checkout.
# Prototype/spike code is sensitive scratch: never committed, dies with the worktree.
# Entry points first (first match wins): the agent index lists these individually
# and groups the rest of the durable tree by directory.
docs:
  - path: ".rubstack/engineering/architecture.md"
    visibility: private
    lifetime: durable
    primary: true

  - path: ".rubstack/product/product.md"
    visibility: private
    lifetime: durable
    primary: true

  - path: ".rubstack/product/roadmap.md"
    visibility: private
    lifetime: durable
    primary: true

  - path: ".rubstack/**"
    visibility: private
    lifetime: durable

  - path: "**/_prototype-*"
    visibility: private
    lifetime: ephemeral
    sensitive: true

  - path: "**/_spike/**"
    visibility: private
    lifetime: ephemeral
    sensitive: true

recipients_file: .doctier/recipients.txt
